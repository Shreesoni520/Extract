<script>
(function () {
  try {
    var t = localStorage.getItem('se_theme');
    if (t !== 'light') {
      document.documentElement.setAttribute('data-theme', 'dark');
      if (t !== 'dark') localStorage.setItem('se_theme', 'dark');
    }
  } catch (_) {}
})();
</script>
</head>
<body class="admin-body">
<nav class="app-nav" aria-label="Main">
  <a class="nav-btn" href="/">&larr; Back</a>
  <div class="app-nav-end">
    <span class="nav-user" data-se-username></span>
    <a class="nav-btn" href="/?browse=1">Find people</a>
    <a class="nav-btn" href="/app/index.html">Upload files</a>
    <a class="nav-btn" href="/app/account.html">Account</a>
    <button type="button" class="nav-btn" id="themeToggle" data-se-theme="1" aria-label="Toggle dark mode" aria-pressed="false">Dark</button>
    <a class="nav-btn nav-btn-dark" href="#" data-se-logout="1">Logout</a>
  </div>
</nav>
  <header class="admin-top">
    <div>
      <h1>Users</h1>
    </div>
  </header>

  <main class="users-layout">
    <section class="panel">
      <h2>Add user</h2>
      <p class="hint">New users can log in, upload files, and appear in public search by username.</p>
      <div id="flashOk"></div>
      <div id="flashErr"></div>
      <form method="post" class="upload-form" autocomplete="off">
        <input type="hidden" name="action" value="add_user" />
        <label>
          <span>Username</span>
          <input type="text" name="username" required minlength="3" maxlength="32"
                 pattern="[a-z0-9._-]+" placeholder="person name"
                 autocapitalize="off" autocorrect="off" spellcheck="false" />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" required minlength="8" />
        </label>
        <label>
          <span>Confirm password</span>
          <input type="password" name="confirm" required minlength="8" />
        </label>
        <button type="submit">Create user</button>
      </form>
    </section>

    <section class="panel">
      <h2>All users</h2>
      <div class="item-table" style="margin-top: 1rem;" id="usersMount"></div>
    </section>
  </main>
  <script src="/assets/js/se-store.js?v=16"></script>
  <script src="/assets/js/se-api.js?v=1"></script>
  <script src="/assets/js/se-auth.js?v=17"></script>
  <script src="/assets/js/se-users-page.js?v=4"></script>
<script src="/assets/js/theme.js?v=5" defer></script>
</body>
