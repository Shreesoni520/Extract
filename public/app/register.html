<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Shree's Extractions</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/assets/img/favicon-48.png" type="image/png" sizes="48x48" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" sizes="180x180" />
<meta name="theme-color" content="#111111" />
<meta property="og:image" content="/assets/img/og-image.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:image" content="/assets/img/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/motion.css?v=1" />
  <link rel="stylesheet" href="/assets/css/app.css?v=23" />
<script>
(function () {
  try {
    var t = localStorage.getItem('se_theme');
    if (t !== 'light') {
      document.documentElement.setAttribute('data-theme', 'dark');
      if (t !== 'dark') localStorage.setItem('se_theme', 'dark');
    }
  } catch (_) {}
})();
</script>
</head>
<body class="login-body">
  <a class="nav-btn login-back" href="/">&larr; Back</a>
  <div class="login-wrap">
    <h1>Sign up</h1>
    <p class="sub">Create a unique username. If you already registered, <a href="/app/login.html">sign in</a> instead.</p>
    <div id="authAlert"></div>
    <form method="post" class="login-form" autocomplete="off">
      <label>
        <span>Username</span>
        <input type="text" name="username" required minlength="3" maxlength="32"
               pattern="[a-z0-9._-]+" autofocus
               autocapitalize="off" autocorrect="off" spellcheck="false"
               autocomplete="username"
               placeholder="yourname" />
        <small id="usernameHint" class="field-hint" hidden></small>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required minlength="8" />
      </label>
      <label>
        <span>Confirm password</span>
        <input type="password" name="confirm" required minlength="8" />
      </label>
      <button type="submit">Sign up</button>
    </form>
    <p class="auth-switch">
      Already have an account?
      <a href="/app/login.html">Sign in</a>
    </p>
  </div>
  <script src="/assets/js/se-store.js?v=8"></script>
  <script src="/assets/js/se-api.js?v=1"></script>
  <script src="/assets/js/se-auth.js?v=9"></script>
<script>
(function () {
  if (!document.getElementById('themeToggle')) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'theme-toggle';
    b.id = 'themeToggle';
    b.setAttribute('aria-label', 'Toggle dark mode');
    b.setAttribute('aria-pressed', 'false');
    b.textContent = 'Dark';
    document.body.appendChild(b);
  }
})();
</script>
<script src="/assets/js/theme.js?v=2" defer></script>
</body>
</html>
